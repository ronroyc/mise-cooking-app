# Runs every test on each push and pull request, on GitHub's servers.
# Tests use a temporary database and a fake AI client, so no secrets are needed.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"  # the oldest version Mise supports (the Mac's built-in Python)
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
